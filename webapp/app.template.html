<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Miles by Masai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@300;400;800&display=swap" rel="stylesheet">
<style>
:root{--red:#e0243e;--red-d:#b01c2e;--ink:#14161f;--night:#1c1f27;--mut:#6b7280;--line:#eceef2;--bg:#f6f6f8;--pink:#fdecef;--card:#fff;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.w{max-width:1120px;margin:0 auto;padding:0 16px}
/* header */
.hd{position:relative;overflow:hidden;background:linear-gradient(112deg,#b8182c 0%,#8c1425 36%,#4a1119 62%,#1c1f27 100%);color:#fff;padding:20px 0 56px}
.hd .wave{position:absolute;left:0;bottom:0;width:75%;height:auto;pointer-events:none}
.hd .w{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.logo{font-family:Poppins,var(--font);line-height:1;padding-top:2px}
.logo .m{display:block;font-weight:800;font-size:46px;letter-spacing:-1.5px}
.logo .b{display:block;font-weight:300;font-size:15px;letter-spacing:.2em;margin-top:6px;opacity:.9}
.alert{display:flex;align-items:center;gap:14px;width:100%;max-width:400px;background:rgba(12,10,16,.5);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px 16px;backdrop-filter:blur(4px)}
.alert .ic{color:#ff4d63;display:flex}.alert .ic .i{width:30px;height:30px;fill:#ff4d63;fill-opacity:.25}
.alert b{display:block;font-size:15px;font-weight:600}
.alert span{font-size:13px;opacity:.78}
.alert.hot{background:rgba(224,36,62,.35);border-color:rgba(255,255,255,.35)}
.alert.ok .ic{color:#6ee7a0}.alert.ok .ic .i{fill:#6ee7a0}
.alert .go{margin-left:auto;opacity:.8;width:18px;height:18px}
.top{gap:12px}
.mini{position:fixed;left:0;right:0;top:var(--ub);z-index:35;background:linear-gradient(100deg,#b8182c,#5a1019 70%,#1d2129);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25);transform:translateY(-110%);transition:transform .25s ease}
.mini.on{transform:none}
.mini .in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.mini .lg2{font-family:Poppins,var(--font);font-weight:800;font-size:19px;letter-spacing:-.5px;line-height:1}
.mini .lg2 span{font-weight:300;font-size:12px;letter-spacing:.14em;margin-left:6px;opacity:.9}
.mini .st{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px}
.mini .st b{font-weight:600}
.mini .chp{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.mini button{height:38px;border-radius:11px;border:0;font:600 14px var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:0 14px}
.mini .rs{background:#fff;color:#b01c2e}
.mini .so{background:none;color:rgba(255,255,255,.75);border:0;padding:0 4px;font-weight:500;font-size:13px}
.mini .so:hover{color:#fff;text-decoration:underline}
.mini .i{width:16px;height:16px}
@media(max-width:700px){.mini .lg2 span,.mini .so .t{display:none}.mini .chp{padding:6px 10px}}
:root{--ub:38px}
.ubar{position:sticky;top:0;z-index:40;height:var(--ub);display:flex;align-items:center;justify-content:center;background:#14161f;color:#e9eaee;font-size:13px;text-align:center;padding:0 16px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){:root{--ub:46px}.ubar{white-space:normal;line-height:1.3;font-size:12px;padding:4px 12px}}
.ubar b{color:#fff;font-weight:600}
.sob{display:inline-flex;align-items:center;gap:6px;order:2;margin-left:auto;height:auto;padding:4px 2px;background:none;border:0;color:rgba(255,255,255,.72);font:500 13px var(--font);cursor:pointer;white-space:nowrap}
.sob .i{width:14px;height:14px}
.sob:hover{color:#fff;text-decoration:underline;text-underline-offset:3px}
.top .logo{order:1}.top .alert{order:3;flex-basis:100%;max-width:none}
.top{align-items:center}
@media(min-width:1000px){.top .alert{order:2;flex-basis:auto;max-width:400px;margin-left:auto}.sob{order:3;margin-left:0}}
.so{position:absolute;right:16px;top:0}
.hero{display:grid;grid-template-columns:1fr;gap:24px;margin-top:28px;align-items:center;justify-items:center;text-align:center}
.ph{display:none}
.greet small{display:block;font-size:22px;font-weight:300;opacity:.95;white-space:nowrap}
.greet h1{margin:0 0 10px;font-size:40px;font-weight:700;line-height:1.15}
.greet p{margin:0;font-size:18px;font-weight:300;opacity:.95}
.ringw{text-align:center}
.ring{position:relative;width:190px;height:190px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring svg{filter:drop-shadow(0 0 10px rgba(255,77,99,.45))}
.ring .n{font-size:42px;font-weight:600;line-height:1}
.ring .u{font-size:13px;letter-spacing:.22em;margin-top:8px;opacity:.9}
.lvl{display:inline-flex;align-items:center;gap:10px;background:rgba(12,10,16,.5);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:9px 20px;font-weight:600;font-size:15px;margin-top:14px}
.lvl-n{margin-top:10px;font-size:14px;opacity:.92;display:flex;align-items:center;justify-content:center;gap:8px}
.lvl-n .i{width:16px;height:16px}
/* grid */
.cols{display:flex;flex-direction:column;gap:16px;margin-top:-30px;position:relative;z-index:2}
.col{display:contents}
/* the columns overlap the header via a negative margin: let clicks fall through the empty container */
.cols,.col{pointer-events:none}
.col>*{pointer-events:auto}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}.o8{order:8}.o9{order:9}
.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 2px 12px rgba(20,22,31,.07)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.ch h2{margin:0;font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
.ch h2 .i{color:var(--ink)}
.ch .r{font-size:14px;color:var(--mut)}
.ch .r.hot{color:var(--red);font-weight:600}
.sub{margin:-8px 0 14px;font-size:14px;color:var(--mut)}
/* this week */
.big{font-size:34px;font-weight:600;line-height:1}
.big small{font-size:16px;font-weight:500;color:var(--mut);margin-left:6px}
.bar{height:12px;border-radius:99px;background:#eceef2;overflow:hidden;margin:14px 0 10px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff5a6e,var(--red));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar.done i{background:linear-gradient(90deg,#34c27f,#1fa968)}
.say{font-size:14px;color:var(--mut)}.say b{color:var(--ink);font-weight:600}
.chain{display:flex;align-items:center;margin:18px 0}
.wn{flex:none;width:48px;height:48px;border-radius:50%;background:#f1f2f5;color:var(--mut);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.wn small{font-size:10px;font-weight:500}
.wn.on{background:var(--red);color:#fff}
.wn.next{background:var(--pink);color:var(--red);border:2px dashed var(--red)}
.ln{flex:1;height:3px;background:#e4e6eb;min-width:6px}.ln.on{background:var(--red)}
.pill{display:flex;align-items:center;gap:10px;background:#f6f6f8;border-radius:12px;padding:10px 14px;font-size:14px;margin-top:8px}
.pill .i{color:var(--red);width:18px;height:18px}
.pill b{font-weight:600}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{border-radius:18px;padding:18px;background:var(--card);box-shadow:0 2px 12px rgba(20,22,31,.07)}
.tile.s{background:linear-gradient(180deg,var(--pink),#fff)}
.ib{width:42px;height:42px;border-radius:50%;background:#fbd9de;color:var(--red);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.tile .l{font-size:15px;font-weight:600}
.tile .v{font-size:40px;font-weight:600;line-height:1.1;margin:4px 0 10px}
.tile .v.r{color:var(--red)}
.btnp{display:inline-block;background:#fbd9de;color:var(--red);font-size:13px;font-weight:600;border-radius:99px;padding:8px 14px}
.btnp.ok{background:#dcf5e7;color:#1b7a4b}
.pips{display:flex;gap:5px;margin-bottom:10px}
.pips i{flex:1;height:8px;border-radius:99px;background:#e9ebf0}.pips i.on{background:var(--red)}
.tile .c{font-size:13px;color:var(--mut)}
/* progress */
.prog{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,#fff3f5)}
.prog .art{position:absolute;right:0;bottom:0;width:52%;max-width:260px;pointer-events:none}
.lv{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:58%;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 6px rgba(20,22,31,.08);border:1px solid transparent;text-align:left;font:inherit;color:inherit}
.lv:hover{border-color:var(--red)}
.lv .ib{width:38px;height:38px;margin:0;background:#f1f2f5;color:var(--mut)}
.lv .t{flex:1;min-width:0;font-size:13px;line-height:1.3;color:var(--mut)}
.lv .t b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
.lv .t em{font-style:normal;font-size:11px}
.lv .i{width:16px;height:16px;color:var(--mut)}
.all{position:relative;z-index:1;background:none;border:0;padding:0;font:600 14px var(--font);color:var(--red);cursor:pointer;margin-top:4px}
/* path + todo */
.item{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .ib{margin:0;background:#f1f2f5;color:var(--mut);width:44px;height:44px}
.item .t{flex:1;min-width:0;font-size:14px;color:var(--mut);line-height:1.35}
.item .t b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
.item .t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font-weight:600;color:var(--red);white-space:nowrap}
.item .i{width:16px;height:16px;color:#b6bac4}
.td{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.td:first-of-type{border-top:0}
.cb{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #d4d7de;display:flex;align-items:center;justify-content:center;color:#fff}
.td.done .cb{background:#1fa968;border-color:#1fa968}
.td.done .t{color:var(--mut);text-decoration:line-through}
.td .t{flex:1;font-size:15px;font-weight:500}
.td .p{font-weight:600;color:var(--red);display:flex;align-items:center;gap:4px}
.td.done .p{color:#1fa968}
.td .p .i{width:16px;height:16px}
/* badges */
.bds{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.bd{border-radius:14px;padding:16px 8px;text-align:center;background:#f6f6f8;font-size:14px;font-weight:600}
.bd .ic{width:52px;height:52px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:#e4e6eb;color:#9aa0ac}
.bd small{display:block;font-weight:400;font-size:12px;color:var(--mut);margin-top:2px}
.bd.c1.on{background:#fff1f3}.bd.c1.on .ic{background:#ffd9df;color:#e0243e}
.bd.c2.on{background:#f5f1ff}.bd.c2.on .ic{background:#e3d9ff;color:#6d4ae0}
.bd.c3.on{background:#effaf4}.bd.c3.on .ic{background:#cdf0dc;color:#1a8f58}
.bd.c4.on{background:#fff6ea}.bd.c4.on .ic{background:#ffe0b8;color:#e07b00}
.bd.c5.on{background:#f5f1ff}.bd.c5.on .ic{background:#e3d9ff;color:#6d4ae0}
.bd.c6.on{background:#eef5ff}.bd.c6.on .ic{background:#cfe2ff;color:#2563eb}
/* help */
.help{display:flex;flex-direction:column;gap:16px;background:linear-gradient(110deg,#a8182b,#3a1018 60%,#1d2129);color:#fff;border-radius:18px;padding:22px}
.help .l{display:flex;align-items:center;gap:16px}
.help .ib{background:var(--red);color:#fff;width:56px;height:56px;margin:0;flex:none}
.help small{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.8}
.help h3{margin:2px 0;font-size:20px;font-weight:600}
.help p{margin:0;font-size:14px;opacity:.85}
.help .acts{display:flex;gap:10px;flex-wrap:wrap}
.hb{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 20px;border-radius:14px;font-weight:600;font-size:15px;text-decoration:none;background:#fff;color:var(--ink);flex:1 1 180px}
.hb.s{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3)}
.foot{text-align:center;font-size:12px;color:var(--mut);margin:16px 0 28px}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(20,22,31,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.dr{position:fixed;z-index:41;background:#fff;box-shadow:-8px 0 30px rgba(20,22,31,.2);transition:transform .25s;overflow:auto;
  left:0;right:0;bottom:0;max-height:84vh;border-radius:22px 22px 0 0;transform:translateY(100%)}
.open .ov{opacity:1;pointer-events:auto}.open .dr{transform:none}
.dh{position:relative;color:#fff;padding:26px 22px 22px;display:flex;gap:16px;align-items:center}
.dh .dic{flex:none;width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.dh .dic .i{width:32px;height:32px}
.dh small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.dh h3{margin:2px 0 0;font-size:26px;font-weight:700;line-height:1.1}
.dh .at{font-size:15px;opacity:.95;margin-top:2px}
.dr .x{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.25);border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;z-index:2}
.db{padding:18px 20px 24px}
.dp{margin-bottom:16px}
.dp .t{height:10px;border-radius:99px;background:#eceef2;overflow:hidden}.dp .t i{display:block;height:100%;border-radius:99px}
.dp span{display:block;margin-top:8px;font-size:14px;font-weight:600}
.rc{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;margin-bottom:10px;background:var(--bg);border:1px solid color-mix(in srgb,var(--c) 22%,transparent)}
.rc .ci{flex:none;width:46px;height:46px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--c)}
.rc .rn{flex:1;font-size:15px;font-weight:600;line-height:1.3}
.rc .st{flex:none;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--c);color:#fff;display:flex;align-items:center;gap:4px}
.rc .st .i{width:14px;height:14px}
.rc.lk{opacity:.92}
.rc.lk .ci{background:#fff;color:var(--c)}
.rc.lk .st{background:#fff;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.rc .ci{background:#fff}
.sec{display:flex;align-items:center;gap:10px;margin:18px 0 10px;padding:10px 14px;border-radius:14px;color:#fff;font-weight:700}
.sec:first-child{margin-top:0}
.sec small{margin-left:auto;font-weight:600;opacity:.9}
.sec .i{width:18px;height:18px}
.gp{margin-top:6px;border-radius:14px;padding:14px 16px;font-size:14px;font-weight:600}
.note{font-size:13px;color:var(--mut);margin-top:16px}
/* compact: the whole drawer fits without scrolling */
.dr{max-height:94vh}
.dh{padding:18px 20px 16px}
.dh .dic{width:52px;height:52px;border-radius:16px}.dh .dic .i{width:26px;height:26px}
.dh h3{font-size:22px}
.dh.slim{padding:16px 56px 14px 20px;gap:12px}
.dh.slim .dic{width:40px;height:40px;border-radius:12px}.dh.slim .dic .i{width:22px;height:22px}
.dh.slim h3{font-size:19px}
.db{padding:14px 16px 16px}
.dp{margin-bottom:10px}
.rc{padding:10px 12px;margin-bottom:8px;gap:12px}
.rc .ci{width:36px;height:36px;border-radius:11px}
.rc .rn{font-size:14px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.rg .rc{margin:0;padding:9px 10px;gap:8px;align-items:center;border-radius:12px}
.rg .rc .rn{font-size:12.5px;line-height:1.25}
.rg .rc .mk{flex:none;display:flex;color:var(--c)}.rg .rc .mk .i{width:16px;height:16px}
.rg .rc:last-child:nth-child(odd){grid-column:1/-1}
.sec{margin:10px 0 8px;padding:8px 12px;font-size:14px;border-radius:12px}
.sec:first-child{margin-top:0}
.gp{margin-top:2px;padding:10px 12px;font-size:13px}
.note{margin-top:10px;font-size:12px}
/* state system: red = unlocked, outlined red = next, grey = locked */
.sec{background:#eceef1;color:#6b7280}
.sec.u{background:linear-gradient(90deg,#d71f3a,#b01c2e);color:#fff}
.sec.n{background:#fff;color:#b01c2e;border:2px solid #e0243e;padding:6px 10px}
.sec.l{background:linear-gradient(90deg,#4d5260,#363a47);color:#fff}
.sec.l .tg{opacity:.85}
.sec .tg{margin-left:auto;font-size:12px;font-weight:700;opacity:.95}
.rc{background:#f3f4f6;border:1px solid #e4e6eb}
.rc .rn{color:#8b909c}
.rc .ci{background:#fff;color:#9aa0ac}
.rc .st{background:#e4e6eb;color:#6b7280;border:0}
.rc .mk{color:#9aa0ac}
.rc.u{background:#fff0f2;border-color:#f3b8c1}
.rc.u .rn{color:var(--ink)}
.rc.u .ci{background:#fff;color:#e0243e}
.rc.u .st{background:#e0243e;color:#fff}
.rc.u .mk{color:#fff;background:#e0243e;border-radius:50%;width:22px;height:22px;align-items:center;justify-content:center}
.rc.u .mk .i{width:13px;height:13px}
.dh.lk{background:linear-gradient(135deg,#3a3e4a,#171a22)!important}
.gp{background:#f3f4f6!important;color:#b01c2e!important}
@media(min-width:760px){.dr{left:auto;top:0;right:0;bottom:0;width:420px;max-height:none;border-radius:0;transform:translateX(100%)}}
/* login */
/* rewards marketplace */
.store{padding:0;overflow:hidden;margin-top:20px}
.sthd{background:linear-gradient(110deg,#c4182f 0%,#7a1221 55%,#25131a 100%);color:#fff;padding:22px 22px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;position:relative;overflow:hidden}
.sthd:after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.sthd small{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.sthd h2{margin:2px 0 4px;font-size:28px;font-weight:700;line-height:1.1}
.sthd p{margin:0;font-size:14px;opacity:.9}
.sthd .sbal{position:relative;z-index:1;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:10px 16px;text-align:right}
.sthd .sbal b{display:block;font-size:26px;font-weight:600;line-height:1.1}
.sthd .sbal span{font-size:12px;opacity:.85}
.stb{padding:16px 18px 20px;background:#fff}
.flt{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.flt button{flex:none;border:1.5px solid #e4e6eb;background:#fff;color:var(--ink);border-radius:99px;padding:8px 16px;font:600 14px var(--font);cursor:pointer}
.flt button.on{background:var(--red);border-color:var(--red);color:#fff}

  </div>`;

  // ---- rewards marketplace (modal) + redeem flow
  const catOf = (n) => /mock|interview prep|resume|\bIM\b/i.test(n) ? "Career" : /doubt|\bTA\b|hackathon/i.test(n) ? "Learn" : "Perks";
  const pendKey = "miles.req." + (st.rid || "x");
  const readPend = () => { try { return JSON.parse(localStorage.getItem(pendKey) || "[]").filter((p) => p.as_of === d.data_as_of); } catch (e) { return []; } };
  let myReq = readPend();
  const savePend = () => { try { localStorage.setItem(pendKey, JSON.stringify(myReq)); } catch (e) {} };
  const spendable = () => bal - myReq.reduce((a, p) => a + p.cost, 0);
  const isReq = (x) => myReq.some((p) => p.reward_id === x.reward_id);
  const sorted = [...rewards].sort((a, b) => (bal >= a.cost) === (bal >= b.cost) ? a.cost - b.cost : bal >= a.cost ? -1 : 1);
  let filt = "all";
  const prod = (x) => { const sp = spendable(), on = sp >= x.cost, rq = isReq(x);
    const nx = !on && !rq && rewards.filter((y) => sp < y.cost).sort((a, b) => a.cost - b.cost)[0]?.reward_id === x.reward_id;
    const pct = Math.min(100, Math.round((sp / x.cost) * 100));
    return `<div class="pr ${rq ? "rqd" : on ? "u" : nx ? "nx" : ""}" data-r="${esc(x.reward_id)}"><div class="pa">${ic(rIc(x.name))}
      <span class="pz">${fmt(x.cost)} Miles</span>${x.tag ? `<span class="tg">${esc(x.tag)}</span>` : ""}${on || rq ? "" : `<span class="lk">${ic("lock")}</span>`}</div>
      <div class="pb"><div class="cat">${catOf(x.name) === "Perks" ? "Perks & merch" : catOf(x.name)}</div><h4>${esc(x.name)}</h4>
      ${rq ? `<div class="done">${ic("tick")} Requested</div>`
        : on ? `<button class="go" type="button">${ic("tick")} Redeem</button>`
        : `<div class="pg2"><div class="t"><i style="width:${pct}%"></i></div><span>${nx ? "Closest to unlock · " : ""}${fmt(x.cost - sp)} Miles to go</span></div>`}</div></div>`; };
  const requestsHtml = () => {
    const mine = [...(st.redemptions || []).map((r) => ({ id: r.reward_id, status: (r.status || "requested").toLowerCase(), when: r.date })),
                  ...myReq.map((p) => ({ id: p.reward_id, status: "requested", when: "" }))];
    if (!mine.length) return "";
    const nm = (id) => (rewards.find((x) => x.reward_id === id) || {}).name || id;
    return `<div class="reqs"><h5>Your requests</h5>${mine.map((m) => `<div class="rq"><span>${esc(nm(m.id))}</span>
      <span class="s ${m.status === "completed" ? "done" : m.status === "rejected" ? "rej" : ""}">${esc(m.status[0].toUpperCase() + m.status.slice(1))}</span></div>`).join("")}</div>`;
  };
  const pgEl = document.getElementById("pg");
  const paint = () => {
    const sp = spendable();
    document.getElementById("sbal").textContent = fmt(sp);
    document.getElementById("stsub").textContent = `${rewards.length} rewards · ${rewards.filter((x) => sp >= x.cost && !isReq(x)).length} ready to redeem`;
    const list = sorted.filter((x) => filt === "all" ? true : filt === "open" ? sp >= x.cost : catOf(x.name) === filt);
    pgEl.innerHTML = list.map(prod).join("") || '<p class="stn" style="grid-column:1/-1">Nothing here yet. Keep earning Miles.</p>';
    document.getElementById("reqs").innerHTML = requestsHtml();
    pgEl.querySelectorAll(".pr").forEach((el) => el.addEventListener("click", () => openDlg(rewards.find((x) => x.reward_id === el.dataset.r))));
  };
  const mdl = document.getElementById("mdl"), dlg = document.getElementById("dlg");
  const openStore = () => { paint(); mdl.classList.add("open"); document.body.style.overflow = "hidden"; };
  const closeStore = () => { mdl.classList.remove("open"); dlg.classList.remove("open"); document.body.style.overflow = ""; };
  document.getElementById("mx").addEventListener("click", closeStore);
  document.getElementById("mbg").addEventListener("click", closeStore);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (dlg.classList.contains("open")) dlg.classList.remove("open"); else closeStore(); } });
  document.getElementById("flt").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (!b) return;
    document.querySelectorAll("#flt button").forEach((x) => x.classList.toggle("on", x === b)); filt = b.dataset.f; paint(); });
  document.getElementById("openStore").addEventListener("click", openStore);

  const dlgShell = (cls, icon, title, sub, content) => { dlg.innerHTML = `<div class="mbg" id="dbg"></div><div class="dgb"><div class="dgh ${cls}"><div class="big">${ic(icon)}</div><h3>${esc(title)}</h3><p>${esc(sub)}</p></div><div class="dgc">${content}</div></div>`;
    dlg.classList.add("open"); document.getElementById("dbg").addEventListener("click", () => dlg.classList.remove("open")); };
  const closeBtn = '<div class="acts"><button class="no" type="button" id="dno">Close</button></div>';
  const bindClose = () => { const n = document.getElementById("dno"); if (n) n.addEventListener("click", () => dlg.classList.remove("open")); };
  const openDlg = (x) => {
    const sp = spendable(), ic0 = rIc(x.name);
    if (isReq(x)) {
      dlgShell("", "tick", "Request sent", x.name, `<p class="msg">Your request is with the team. They will reach out to schedule or activate it.</p>${closeBtn}`); bindClose(); return;
    }
    if (sp < x.cost) {
      const gap = x.cost - sp;
      dlgShell("lk", "lock", x.name, `${fmt(x.cost)} Miles`, `<div class="kv"><span>Your Miles</span><b>${fmt(sp)}</b></div><div class="kv"><span>Still needed</span><b class="neg">${fmt(gap)}</b></div>
        <p class="msg">About ${Math.ceil(gap / 200)} live lectures or ${Math.ceil(gap / 100)} practice assignments away.</p>${closeBtn}`); bindClose(); return;
    }
    const live = !!REDEEM_ENDPOINT;
    dlgShell("", ic0, x.name, `${fmt(x.cost)} Miles`, `<div class="kv"><span>Your Miles</span><b>${fmt(sp)}</b></div><div class="kv"><span>This reward</span><b class="neg">− ${fmt(x.cost)}</b></div>
      <div class="kv"><span>Left after</span><b>${fmt(sp - x.cost)}</b></div>
      <p class="msg">${live ? "Miles are deducted from your balance and the team reaches out to schedule or activate your reward." : "Redemption inside the dashboard is not switched on yet."}${!live && REDEEM_FORM_URL ? " Use the redemption form instead." : ""}</p>
      <div class="err" id="derr"></div>
      <div class="acts"><button class="no" type="button" id="dno">Cancel</button>${live ? `<button class="yes" type="button" id="dyes">Confirm redeem</button>` : REDEEM_FORM_URL ? `<a class="yes" href="${esc(REDEEM_FORM_URL)}" target="_blank" rel="noopener">Open form</a>` : ""}</div>`);
    bindClose();
    const yes = document.getElementById("dyes"); if (!yes) return;
    yes.addEventListener("click", async () => {
      yes.disabled = true; yes.textContent = "Sending…"; document.getElementById("derr").textContent = "";
      const body = { request_id: (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random()), rid: st.rid, tok: st.tok,
        as_of: d.data_as_of, balance: d.current_balance, reward_id: x.reward_id, reward_name: x.name,
        name: d.name, email: (st.contact || {}).email, phone: (st.contact || {}).phone, batch: d.batch };
      try {
        const res = await fetch(REDEEM_ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
        const j = await res.json();
        if (!j.ok) throw new Error(j.error || "failed");
        myReq.push({ reward_id: x.reward_id, cost: x.cost, as_of: d.data_as_of, request_id: body.request_id }); savePend(); paint(); paintWallet();
        dlgShell("", "tick", "Request sent", x.name, `<p class="msg">We have your request. ${fmt(x.cost)} Miles are reserved and the team will reach out to schedule or activate it.</p>${closeBtn}`); bindClose();
      } catch (e) {
        yes.disabled = false; yes.textContent = "Confirm redeem";
        document.getElementById("derr").textContent = /insufficient/.test(String(e.message)) ? "Your balance has changed. Refresh and try again."
          : "We couldn't send your request. Check your connection and try again, or raise a ticket.";
      }
    });
  };

  // ---- wallet (earned / used / available) and leaderboard
  const walletEl = document.getElementById("wallet");
  const paintWallet = () => {
    const reserved = myReq.reduce((a, p) => a + p.cost, 0), used = d.total_redeemed + reserved;
    const avail = bal - reserved, earned2 = d.total_earned;
    const pctUsed = earned2 ? Math.min(100, Math.round((used / earned2) * 100)) : 0;
    walletEl.innerHTML = `<div class="ch" style="margin-bottom:8px"><h2>Miles wallet</h2><span class="r">${used > 0 ? pctUsed + "% used" : "Nothing used yet"}</span></div>
      <div class="wr"><div class="row3"><div class="c"><b>${fmt(earned2)}</b><span>Earned</span></div>
        <div class="c u"><b>${fmt(used)}</b><span>Used${reserved ? " (incl. requested)" : ""}</span></div>
        <div class="c a"><b>${fmt(avail)}</b><span>Available</span></div></div>
      <div class="stk"><i style="width:${100 - pctUsed}%;background:linear-gradient(90deg,#ee3a52,#c4182f)"></i><i style="width:${pctUsed}%;background:#4d5260"></i></div>
      <div class="lgd"><span><s style="background:#d71f3a"></s>Available</span><span><s style="background:#4d5260"></s>Used on rewards</span></div></div>`;
    const ringNum = document.querySelector(".ring .n"); if (ringNum) ringNum.textContent = fmt(avail);
    const mb = document.getElementById("mbal"); if (mb) mb.textContent = fmt(avail);
  };
  const boardEl = document.getElementById("board");
  let boardTab = "week";
  const paintBoard = () => {
    const lb = st.leaderboard || {}, rk = st.rank || {};
    const list = lb[boardTab] || [];
    const me = rk[boardTab];
    const inTop = list.some((x) => x.you);
    boardEl.innerHTML = `<div class="ch"><h2>${ic("award")} Leaderboard</h2>
      <div class="tabs"><button type="button" data-b="week" class="${boardTab === "week" ? "on" : ""}">This week</button><button type="button" data-b="all" class="${boardTab === "all" ? "on" : ""}">All time</button></div></div>
      ${list.length ? `<div class="lbs">` + list.map((x) => `<div class="lb r${x.r} ${x.you ? "me" : ""}"><div class="rk">${x.r}</div><div class="nm">${esc(x.n)}</div><div class="mm">${fmt(x.m)}</div></div>`).join("") + `</div>`
        : '<div class="say">No Miles on the board yet. Be the first.</div>'}
      ${me && !inTop ? `<div class="lbs" style="margin-top:12px;grid-template-columns:1fr"><div class="lb me" style="flex-direction:row;text-align:left"><div class="rk">${me.r}</div><div class="nm">${esc((d.name || "").split(" ")[0] || "You")}</div><div class="mm">${fmt(me.m)}</div></div></div>` : ""}
      <div class="lbf">${me ? `You are #${me.r} of ${me.of} in your batch` : ""}</div>`;
    boardEl.querySelectorAll("[data-b]").forEach((b) => b.addEventListener("click", () => { boardTab = b.dataset.b; paintBoard(); }));
  };
  paintWallet(); paintBoard();
  // sticky mini bar: slides in once the hero has scrolled away
  const mini = document.getElementById("mini");
  const onScroll = () => mini.classList.toggle("on", window.scrollY > 260);
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();
  document.getElementById("mstore").addEventListener("click", () => openStore());
  document.getElementById("mout").addEventListener("click", () => loginView());
  const outBtn = document.getElementById("out"); if (outBtn) outBtn.addEventListener("click", () => loginView());
  // rewards drawer: right-side card (bottom sheet on phones), coloured per stage
  const dr = document.getElementById("dr"), root = document.getElementById("root");
  const nextIdx = tiers.findIndex((t) => bal < t.l.at);
  const card = (x, on) => `<div class="rc ${on ? "u" : "lk"}"><div class="ci">${ic(rIc(x.name))}</div><div class="rn">${esc(x.name)}</div>
    <span class="st">${on ? ic("tick") + "Unlocked" : ic("lock") + "Locked"}</span></div>`;
  const note = `<p class="note">${REDEEM_FORM_URL ? `<a href="${esc(REDEEM_FORM_URL)}">Open the redemption form</a>` : "Redeem using the Miles form shared with you. Dashboard redemption starts in November."}</p>`;
  const openDrawer = (k) => {
    let html;
    if (k === "all") {
      const chip = (x, on) => `<div class="rc ${on ? "u" : "lk"}"><div class="rn">${esc(x.name)}</div><span class="mk">${ic(on ? "tick" : "lock")}</span></div>`;
      html = `<div class="dh slim" style="background:linear-gradient(135deg,#b8182c,#2a0a10)"><div class="dic">${ic("award")}</div>
        <div><h3>All rewards</h3><div class="at">${rewards.filter((x) => bal >= x.cost).length} of ${rewards.length} unlocked</div></div></div>
        <div class="db">${tiers.map((t, i) => { const on = bal >= t.l.at, isNext = i === nextIdx;
          const cls = on ? "u" : isNext ? "n" : "l", tag = on ? "Unlocked" : isNext ? fmt(t.l.at - bal) + " to go" : fmt(t.l.at) + " Miles";
          return `<div class="sec ${cls}">${ic(on ? "tick" : isNext ? t.l.ic : "lock")}<span>${t.l.name}</span><span class="tg">${on ? fmt(t.l.at) + " · " : ""}${tag}</span></div><div class="rg">` + t.rs.map((x) => chip(x, on)).join("") + `</div>`; }).join("")}${note}</div>`;
    } else {
      const t = tiers[+k], on = bal >= t.l.at, gap = t.l.at - bal, pct = Math.min(100, Math.round((bal / t.l.at) * 100));
      html = `<div class="dh ${on ? "" : "lk"}" style="${on ? "background:linear-gradient(135deg,#d71f3a,#8e1424)" : ""}"><div class="dic">${ic(on ? t.l.ic : "lock")}</div>
        <div><small>${on ? "Unlocked" : "Locked · " + fmt(gap) + " to go"}</small><h3>${t.l.name}</h3><div class="at">${fmt(t.l.at)} Miles</div></div></div>
        <div class="db"><div class="dp"><div class="t"><i style="width:${pct}%;background:#e0243e"></i></div><span style="color:${on ? "#b01c2e" : "#6b7280"}">${on ? "You have enough Miles. Redeem any of these." : pct + "% of the way there"}</span></div>
        ${t.rs.map((x) => card(x, on)).join("")}
        ${on ? "" : `<div class="gp">About ${Math.ceil(gap / 200)} live lectures or ${Math.ceil(gap / 100)} practice assignments away</div>`}${note}</div>`;
    }
    dr.innerHTML = `<button class="x" id="dx" aria-label="Close">${ic("x")}</button>` + html;
    root.classList.add("open");
    document.getElementById("dx").addEventListener("click", closeDrawer);
  };
  const closeDrawer = () => root.classList.remove("open");
  document.getElementById("ov").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
  document.querySelectorAll("[data-t]").forEach((el) => el.addEventListener("click", () => el.dataset.t === "all" ? openStore() : openDrawer(el.dataset.t)));
  const jump = document.getElementById("jump"); if (jump) jump.addEventListener("click", openStore);

  document.querySelectorAll("[data-count]").forEach((el) => {
    const to = +el.dataset.count, t0 = performance.now();
    const step = (t) => { const k = Math.min(1, (t - t0) / 800); el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  requestAnimationFrame(() => {
    const rf = document.getElementById("ringfg");
    if (rf) rf.style.strokeDashoffset = (+rf.dataset.c) * (1 - (+rf.dataset.pct) / 100);
    document.querySelectorAll("[data-w]").forEach((b) => (b.style.width = b.dataset.w + "%"));
  });
  window.scrollTo(0, 0);
}
loginView();
</script>
</body>
</html>
