name: Daily Miles refresh

# Vercel rebuilds the site (Metabase -> Miles -> encrypted page) whenever its deploy hook is called.
# 03:30 UTC = 09:00 IST. GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel build
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK secret is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
